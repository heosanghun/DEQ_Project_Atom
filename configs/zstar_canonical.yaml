# configs/zstar_canonical.yaml
# Canonical configuration for fixed-point z* generation (Stage 4 / Task 20)
# System 2 Directive: EXE-260913-07

# Solvers: 'picard' or 'anderson'
solver: "picard"

# Hyperparameters
g0: 0.25
alpha: 0.5
seed: 2030
tol: 0.0001
max_nfe: 1000
k_latent: 64
sigma_noise: 0.020
top_k: 3
routing_mode: "sparse"

# Anderson mixing hyperparameters
anderson_m: 5
anderson_beta: 1.0
anderson_safeguard: true
